<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102a34">
<meta property="og:type" content="website">
<meta property="og:title" content="異界巡旅：消失的城鎮記憶">
<meta property="og:description" content="翰林版六年級社會課前 3D 冒險：找回記憶碎片、解開謎題、和全班比比看。">
<meta property="og:image" content="https://lost-town-memories.ydlo-school.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<meta name="description" content="翰林版六年級社會課前 3D 冒險，選擇六上、六下單元，用線索找回城鎮的記憶。">
<title>異界巡旅：消失的城鎮記憶</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="adventure.css">
<link rel="stylesheet" href="polish.css">
<script defer src="lesson.js"></script>
<script defer src="units.js"></script>
<script defer src="world.js"></script>
<script defer src="wardrobe.js"></script>
<script defer src="fleet.js"></script>
<script defer src="quiz.js"></script>
<script defer src="game.js"></script>
<script defer src="costumes.js"></script>
<script defer src="gear.js"></script>
<script defer src="review.js"></script>
<script defer src="fx.js"></script>
<script defer src="cloud.js"></script>
</head>
<body>
<div id="app" data-mode="home">
  <header class="top">
    <button id="home-link" class="brand" type="button" aria-label="遊戲首頁"><span class="crest" aria-hidden="true">✧</span><span><strong>異界巡旅</strong><small>消失的城鎮記憶</small></span></button>
    <div class="head-meta"><span class="status-dot"></span><span id="source-tag"></span></div>
    <button id="switch" class="quiet" type="button" hidden>選單元</button>
    <button id="dress" class="quiet" type="button">角色換裝</button>
    <button id="coins" class="quiet coin-chip" type="button" aria-label="金幣與載具船塢">🪙 <span id="coin-count">0</span></button>
    <button id="book-btn" class="quiet" type="button" aria-label="錯題本">📕<span class="lbl"> 錯題本</span><span id="book-count" class="badge"></span></button>
    <button id="cloud-btn" class="quiet" type="button">☁<span class="lbl"> 我的紀錄</span></button>
    <button id="sound" class="quiet" type="button" aria-pressed="true" aria-label="開關音效"><span class="ico">🔊</span><span class="lbl"> 音效</span></button>
    <button id="help" class="quiet" type="button">操作說明</button>
  </header>
  <main id="stage" aria-label="3D 冒險遊戲畫面">
    <div id="world-view"><canvas id="world" aria-hidden="true"></canvas></div>
    <div id="guide-trail" aria-hidden="true"></div>
    <div id="markers" aria-label="任務地標"></div>
    <section id="home" class="portal" aria-labelledby="home-title">
      <div class="portal-hero">
        <div class="portal-intro">
          <p class="portal-subject"><span aria-hidden="true">✦</span> 翰林版社會課前預習</p>
          <h1 id="home-title">異界巡旅<span>消失的城鎮記憶</span></h1>
          <p class="portal-story">散落的記憶碎片等你找回。選一個社會單元，走進 3D 場景，和居民一起解開謎題。</p>
          <a class="portal-cta" href="#portal-levels"><span aria-hidden="true">✦</span> 選擇單元</a>
        </div>
        <div class="portal-scene" aria-label="港灣市集 3D 場景預覽">
          <div class="portal-coordinates" aria-hidden="true"><span></span><span></span></div>
          <div class="portal-scene-label"><span class="scene-icon" aria-hidden="true">✧</span><span><strong>港灣市集</strong><small>3D 場景預覽</small></span></div>
        </div>
      </div>
      <div class="portal-levels" id="portal-levels" tabindex="-1">
        <div class="portal-section-head"><h2>從哪裡出發？</h2><p>每關約 5–8 分鐘</p></div>
        <div class="portal-entries">
          <button class="portal-entry portal-upper" id="start-upper" type="button">
            <span class="portal-emblem" aria-hidden="true">上</span>
            <span class="portal-entry-copy"><strong>六上關卡</strong><span>理財、科技與文化等 6 關</span></span>
            <span class="portal-entry-action" aria-hidden="true">選關</span>
          </button>
          <button class="portal-entry portal-lower" id="start-lower" type="button">
            <span class="portal-emblem" aria-hidden="true">下</span>
            <span class="portal-entry-copy"><strong>六下關卡</strong><span>貿易、社會與永續等 4 關</span></span>
            <span class="portal-entry-action" aria-hidden="true">選關</span>
          </button>
          <button class="portal-entry portal-sample" id="start-sample" type="button">
            <span class="portal-emblem" aria-hidden="true">◆</span>
            <span class="portal-entry-copy"><strong>港灣市集</strong><span id="sample-progress">架空示範關卡</span></span>
            <span class="portal-entry-action" aria-hidden="true">試玩</span>
          </button>
        </div>
        <p class="portal-footnote">支援電腦與平板 <span aria-hidden="true">·</span> 無須登入 <span aria-hidden="true">·</span> 進度自動雲端備份，可和全班一起比賽</p>
      </div>
    </section>
    <section id="mission" class="hud" hidden aria-live="polite">
      <p class="eyebrow" id="mission-no"></p><h2 id="mission-title"></h2><p id="mission-hint"></p><p id="scene-coins" class="scene-coins"></p>
      <div class="destination"><span aria-hidden="true">◆</span><button id="destination" type="button"></button></div>
      <button id="route-help" class="quiet" type="button" aria-pressed="false">找路提示</button>
    </section>
    <section id="sail-hud" class="hud" hidden aria-live="polite">
      <p class="eyebrow" id="sail-vehicle"></p><h2 id="sail-title"></h2>
      <div class="sail-bar" aria-hidden="true"><i id="sail-fill"></i></div>
      <div class="sail-stats"><span>❤️ <b id="hp-text"></b></span><div class="mini-bar hp" aria-label="生命值"><i id="hp-fill"></i></div><span>⚡</span><div class="mini-bar sta" aria-label="體力"><i id="sail-sta"></i></div></div>
      <p id="sail-status"></p>
      <button id="sail-abort" class="quiet" type="button">回碼頭</button>
    </section>
    <div id="progress" class="hud" hidden><span>記憶碎片</span><div class="gems" aria-hidden="true"><i></i><i></i><i></i></div><strong id="count" aria-live="polite"></strong><small id="skill-badge" class="skill-badge"></small><div class="mini-bar sta" title="體力" aria-label="體力"><i id="sta-fill"></i></div></div>
    <div id="controls" hidden>
      <div class="dpad" aria-label="觸控移動">
        <button data-move="up" aria-label="往上走">▲</button><button data-move="left" aria-label="往左走">◀</button><button data-move="down" aria-label="往下走">▼</button><button data-move="right" aria-label="往右走">▶</button>
      </div>
      <button id="interact" class="primary interact" hidden type="button"></button>
      <div class="world-actions"><button id="sprint-btn" class="quiet sprint" type="button">⚡ 衝刺</button><button id="skill-btn" class="quiet skill" type="button" hidden></button><button id="journal" class="quiet" type="button">線索筆記</button><button id="return" class="quiet" type="button">回到廣場</button></div>
    </div>
    <div id="repair" class="repair" hidden role="status">✦ 城鎮的記憶正在復原 ✦</div>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
  <footer><div class="keys"><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> <span>或方向鍵移動</span><span class="key key-e">E</span><span>互動</span></div><span id="footer-source"></span></footer>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
<dialog id="review" aria-labelledby="review-title"><div id="review-body"></div></dialog>
<dialog id="cloud" aria-labelledby="cloud-title"><div id="cloud-body"></div></dialog>
<dialog id="wardrobe" aria-labelledby="dress-title"><form method="dialog">
<h2 id="dress-title">巡旅者的衣櫃</h2><div class="dress-layout">
<div class="dress-preview"><canvas id="model" width="240" height="240" aria-label="目前的角色造型"></canvas><button id="rotate" class="quiet" type="button">轉動角色</button></div>
<div id="clothes"></div></div><section id="costumes" aria-labelledby="costume-title"><h3 id="costume-title">專屬服裝・金幣購買</h3><div id="costume-list"></div></section>
<section id="gear" aria-labelledby="gear-title"><h3 id="gear-title">冒險裝備・能力值</h3><div id="gear-list"></div></section>
<button class="primary" type="submit">穿好出發</button>
</form></dialog></body>
</html>
